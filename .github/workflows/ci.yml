name: "Verificacion de Integridad - BioAves Quilichao"

on:
  push:
    branches:
      - main
      - master
      - dev
      - develop
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - master
      - dev
      - develop

jobs:
  verify-and-test:
    name: "Verificacion de Integridad y Sintaxis"
    runs-on: ubuntu-latest

    steps:
      - name: "Clonar repositorio"
        uses: actions/checkout@v4

      - name: "Configurar Node.js (Entorno de Validacion)"
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: "Paso 1: Verificar presencia e integridad de archivos esenciales"
        run: node scripts/verify-files.js

      - name: "Paso 2: Validar sintaxis estricta de JavaScript"
        run: |
          echo "Validando sintaxis de archivos JS..."
          node --check js/birds-data.js
          node --check js/app.js
          node --check js/catalogo.js
          echo "Todos los archivos JavaScript tienen sintaxis 100% valida."

      - name: "Paso 3: Verificar enlaces y referencias internas"
        run: node scripts/verify-links.js

      - name: "Paso 4: Validar estructura y etiquetas HTML"
        run: |
          echo "Ejecutando linter HTML (HTMLHint)..."
          npx --yes htmlhint index.html catalogo.html

      - name: "Paso 5: Generar resumen de verificacion en GitHub"
        if: always()
        run: |
          echo "### 🛡️ Reporte de Verificación de Integridad - BioAves Quilichao" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Validación | Estado | Descripción |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Archivos Esenciales | ✅ | index.html, catalogo.html, css/styles.css, js/ |" >> $GITHUB_STEP_SUMMARY
          echo "| Sintaxis JavaScript | ✅ | birds-data.js, app.js, catalogo.js sin errores |" >> $GITHUB_STEP_SUMMARY
          echo "| Enlaces Locales | ✅ | Rutas relativas y referencias validadas |" >> $GITHUB_STEP_SUMMARY
          echo "| Estructura HTML5 | ✅ | Etiquetas y atributos conformes con estándares |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✨ **El commit / pull request cumple con los estándares del equipo.**" >> $GITHUB_STEP_SUMMARY
