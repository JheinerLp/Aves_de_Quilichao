services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bioaves-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=production
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=bioaves_db
      - DB_USERNAME=bioaves_user
      - DB_PASSWORD=bioaves_secret_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - bioaves-network
    depends_on:
      - db
      - redis

  webserver:
    image: nginx:alpine
    container_name: bioaves-webserver
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - bioaves-network
    depends_on:
      - app

  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: bioaves-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: bioaves_db
      POSTGRES_USER: bioaves_user
      POSTGRES_PASSWORD: bioaves_secret_password
    ports:
      - "54320:5432"
    volumes:
      - bioaves-pgdata:/var/lib/postgresql/data
    networks:
      - bioaves-network

  redis:
    image: redis:7-alpine
    container_name: bioaves-redis
    restart: unless-stopped
    ports:
      - "63790:6379"
    volumes:
      - bioaves-redisdata:/data
    networks:
      - bioaves-network

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bioaves-queue
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90"]
    networks:
      - bioaves-network
    depends_on:
      - app
      - redis
      - db

networks:
  bioaves-network:
    driver: bridge

volumes:
  bioaves-pgdata:
  bioaves-redisdata:
