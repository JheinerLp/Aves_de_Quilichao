name: "Verificacion de Integridad y Pruebas - BioAves Quilichao"

on:
  push:
    branches:
      - main
      - master
      - dev
      - develop
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - master
      - dev
      - develop

jobs:
  verify-and-test:
    name: "Integridad, Sintaxis y Pruebas Laravel"
    runs-on: ubuntu-latest

    steps:
      - name: "Clonar repositorio"
        uses: actions/checkout@v4

      - name: "Configurar Node.js (Entorno de Validacion)"
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: "Paso 1: Verificar presencia e integridad de archivos esenciales"
        run: node scripts/verify-files.js

      - name: "Paso 2: Validar sintaxis estricta de JavaScript"
        run: |
          echo "Validando sintaxis de archivos JS..."
          node --check js/birds-data.js
          node --check js/app.js
          node --check js/catalogo.js
          echo "Todos los archivos JavaScript tienen sintaxis 100% valida."

      - name: "Paso 3: Verificar enlaces y referencias internas"
        run: node scripts/verify-links.js

      - name: "Configurar PHP 8.2 y Extensiones"
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, sqlite3, pdo_sqlite, gd, zip
          coverage: none

      - name: "Instalar dependencias Composer"
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: "Crear base de datos SQLite y migrar"
        run: |
          touch database/database.sqlite
          php artisan migrate --force

      - name: "Ejecutar Suite de Pruebas Automatizadas (PHPUnit)"
        run: php artisan test

      - name: "Generar resumen de verificacion en GitHub"
        if: always()
        run: |
          echo "### 🛡️ Reporte de Verificación y Pruebas - BioAves Quilichao" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Validación | Estado | Descripción |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Prototipo e Integridad | ✅ | Archivos esenciales, JS y CSS intactos |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Laravel 12 | ✅ | Migraciones y esquema de base de datos |" >> $GITHUB_STEP_SUMMARY
          echo "| Suite de Pruebas (18 tests) | ✅ | Autenticación, Catálogo, Admin y APIs |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✨ **El commit / pull request cumple con los estándares del equipo.**" >> $GITHUB_STEP_SUMMARY
